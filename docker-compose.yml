services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wellness_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a local development password}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-platform} -d $${POSTGRES_DB:-wellness_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - platform-postgres:/var/lib/postgresql/data

  application:
    build: .
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: ${DATABASE_URL:?set a local development database URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  platform-postgres:
