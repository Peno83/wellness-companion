name: Documentation quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20
        with:
          config: ".markdownlint.jsonc"
          globs: "**/*.md"

  broken-links:
    name: Broken links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: "--no-progress --config .lychee.toml '**/*.md'"
          fail: true

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check spelling
        uses: streetsidesoftware/cspell-action@76c6f6d52abd57f4bcab5f3fde1bbd4f19a99eb0 # v7
        with:
          config: ".cspell.json"
          incremental_files_only: false
          use_cspell_files: true

  phase-boundary:
    name: Phase boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test boundary rules
        shell: pwsh
        run: ./.github/scripts/Test-PhaseBoundary.ps1 -SelfTest
      - name: Test workflow policy
        shell: pwsh
        run: ./.github/scripts/Test-WorkflowPolicy.ps1 -SelfTest
      - name: Validate workflow policy
        shell: pwsh
        run: ./.github/scripts/Test-WorkflowPolicy.ps1
      - name: Enforce Phase 2A.1 boundary
        shell: pwsh
        run: ./.github/scripts/Test-PhaseBoundary.ps1

  secret-patterns:
    name: Secret patterns
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test secret detection rules
        shell: pwsh
        run: ./.github/scripts/Test-SecretPatterns.ps1 -SelfTest
      - name: Check repository content
        shell: pwsh
        run: ./.github/scripts/Test-SecretPatterns.ps1

  platform-foundation:
    name: Platform foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://localhost:5432/wellness_platform?schema=public
      APP_VERSION: 0.1.0
      LOG_LEVEL: info
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Lint source
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Run unit and integration tests
        run: npm run test
      - name: Run integration suite explicitly
        run: npm run test:integration
      - name: Check architecture boundaries
        run: npm run test:architecture
      - name: Attack architecture boundaries
        run: npm run test:architecture:attack
      - name: Build application
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: npm run test:e2e
